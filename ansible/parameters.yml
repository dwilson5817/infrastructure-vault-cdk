---

- name: Read all parameters under /vault/
  ansible.builtin.set_fact:
    vault_parameters: >-
      {{ lookup('amazon.aws.ssm_parameter', '/vault/',
                bypath=true, recursive=true, shortnames=false,
                region=ansible_ec2_placement_region,
                endpoint_url='https://ssm.' ~ aws_dualstack_domain) }}
  no_log: true

- name: Ensure required parameters exist
  ansible.builtin.assert:
    that: item in vault_parameters
    fail_msg: "Missing required SSM parameter {{ item }} (see README.md)"
    quiet: true
  loop:
    - /vault/cloudflare-tunnel-credentials
