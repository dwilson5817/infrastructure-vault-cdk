---

- name: Upgrade all packages
  ansible.builtin.dnf:
    name: "*"
    state: latest

- name: Install HashiCorp Vault
  ansible.builtin.include_role:
   name: vault

- name: Publish Vault through a Cloudflare Tunnel
  ansible.builtin.include_role:
    name: cloudflared
  vars:
    cloudflared_credentials: "{{ vault_parameters['/vault/cloudflare-tunnel-credentials'] }}"
    cloudflared_hostname: vault.dylanw.net
    cloudflared_service: http://127.0.0.1:8200
