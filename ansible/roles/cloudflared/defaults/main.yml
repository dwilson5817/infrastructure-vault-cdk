---

# Downloaded into the asset by bundle.yml
cloudflared_version: 2026.10.7
# From the "SHA256 Checksums" section of the release notes, update with cloudflared_version
cloudflared_checksums:
  arm64: 3df43aedc9ff291d1735b5cb576cb97e0b157488796db2e32b28aecabb445775
  amd64: 1f99fb518b83dec2ba8d870a7cc991d82a77e6196295a3d2754ba17ab9f91872
cloudflared_user: cloudflared
cloudflared_group: cloudflared
cloudflared_config_path: /etc/cloudflared
# The instance has no public IPv4 address, so only connect to Cloudflare over IPv6. The
# default (auto) follows the resolver, which may pick IPv4 addresses that are unreachable.
cloudflared_edge_ip_version: "6"

# Required, set by the playbook:
# bundle_binaries_path
# Required, set by the including role:
# cloudflared_credentials (tunnel credentials JSON), cloudflared_hostname, cloudflared_service
